[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# The site publishes the repo root, so keep the server code and this file from being served.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
